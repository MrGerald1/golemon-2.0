<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLemon — Food Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F7EA;--surface:#FFFFFF;--ink:#15431F;--ink2:#2C4A36;--slate:#5C6B60;--muted:#8A938C;--line:#E7ECE0;
    --green:#1E7A3C;--green-deep:#15431F;--lime:#CDEE63;--lime-deep:#A9D63F;--dark:#0C2A14;
    --coral-bg:#FDE7E0;--coral-ink:#C5391F;--cream-bg:#FBEFD6;--cream-ink:#9A6410;--mintg-bg:#E7F4E6;--mintg-ink:#2E7D43;
    --t-mint:#DDF3D8;--t-amber:#FCEFC2;--t-peach:#FBE3D0;--t-teal:#DCEFEA;--t-blue:#E2ECFB;--t-pink:#FBE2E8;--t-cream:#FBEFD6;--t-coral:#FBE3D0;
    --shadow:0 4px 16px rgba(20,50,25,.07);--shadow-lg:0 12px 34px rgba(20,50,25,.16);--r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:18px;padding:0 24px}
  .logo{font-weight:800;font-size:20px;color:var(--green-deep);letter-spacing:-.4px;cursor:pointer;white-space:nowrap}
  .search{flex:1;max-width:460px;height:42px;border-radius:22px;background:var(--bg);display:flex;align-items:center;gap:9px;padding:0 16px;color:var(--muted);font-size:14px;font-family:'IBM Plex Sans';cursor:pointer;border:1px solid var(--line)}
  nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nlink{font-family:'IBM Plex Sans';font-size:14px;font-weight:600;color:var(--slate);padding:9px 14px;border-radius:20px}
  .nlink:hover{background:var(--bg);color:var(--ink)}
  .nlink.on{color:var(--green);background:var(--mintg-bg)}
  .cartbtn{position:relative;display:flex;align-items:center;gap:7px;font-family:'IBM Plex Sans';font-size:14px;font-weight:700;color:#fff;background:var(--green);padding:9px 16px;border-radius:22px;border:none}
  .cartbtn .badge{background:var(--lime);color:var(--green-deep);font-size:11px;font-weight:800;border-radius:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  /* ---------- layout ---------- */
  main{flex:1;width:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
  .wrap.narrow{max-width:780px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.6px;color:var(--green-deep)}
  h2{font-size:18px;font-weight:800;color:var(--green-deep)}
  .sub{color:var(--slate);font-size:14px;margin-top:3px}
  .sm{font-size:13px;color:var(--slate)}.xs{font-size:12px;color:var(--muted)}
  .rowbtw{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{font-family:'IBM Plex Sans';font-weight:600;font-size:14px;color:var(--green);display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:14px}
  /* buttons */
  .btn{font-family:'IBM Plex Sans';display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:26px;font-weight:700;font-size:15px;border:none}
  .btn.primary{background:var(--green);color:#fff}.btn.lime{background:var(--lime);color:var(--green-deep)}.btn.outline{background:#fff;border:1.6px solid var(--green);color:var(--green)}.btn.block{width:100%}
  .btn:active{transform:scale(.99)}.btn:disabled{opacity:.5}
  .addbtn{font-family:'IBM Plex Sans';height:34px;padding:0 18px;border-radius:18px;background:#fff;border:1.5px solid var(--green);color:var(--green);font-weight:700;font-size:13px}.addbtn.in{background:var(--green);color:#fff}
  /* hero / promo */
  .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:26px}
  .hero .big{background:var(--dark);color:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:center}
  .hero .big h1{color:#fff;font-size:26px;line-height:1.2}.hero .big p{color:#B7D6A8;margin:10px 0 18px;font-size:14px;max-width:340px;line-height:1.6}
  .hero .side{background:var(--t-peach);border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center}
  .hero .side b{color:var(--coral-ink);font-size:16px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
  .chip{font-family:'IBM Plex Sans';font-size:13px;font-weight:600;padding:9px 16px;border-radius:20px;background:#fff;border:1.4px solid var(--line);cursor:pointer}.chip.on{background:var(--mintg-bg);border-color:var(--green);color:var(--green)}
  /* product grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .pcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .pcard .img{height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:11px;position:relative}
  .pcard .off{position:absolute;top:8px;left:8px;font-family:'IBM Plex Sans';font-size:10px;font-weight:700;background:var(--coral-bg);color:var(--coral-ink);padding:3px 9px;border-radius:14px}
  .pcard .nm{font-size:14px;font-weight:600;line-height:1.3;color:var(--ink)}.pcard .un{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
  .pcard .pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .price{font-family:'IBM Plex Sans';font-weight:700;font-size:15px;color:var(--green-deep)}.strike{font-family:'IBM Plex Sans';font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:5px}
  /* cart / summary */
  .panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
  .citem{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.citem:last-child{border-bottom:none}.citem .e{width:56px;height:56px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}.citem .meta{flex:1;min-width:0}.prep{font-family:'IBM Plex Sans';font-size:11px;font-weight:700;color:var(--green);background:var(--mintg-bg);display:inline-block;padding:3px 9px;border-radius:12px;margin-top:5px}
  .qty{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:22px;padding:5px 9px}.qty button{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:var(--green);font-size:18px;font-weight:700;box-shadow:var(--shadow)}.qty span{font-family:'IBM Plex Sans';font-weight:700;min-width:18px;text-align:center}
  .sline{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;color:var(--ink2);font-family:'IBM Plex Sans'}.sline.tot{border-top:1px solid var(--line);margin-top:7px;padding-top:12px;font-weight:800;font-size:17px;color:var(--green-deep)}
  .cartlayout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  /* meal plan */
  .cover{display:flex;align-items:center;gap:12px;background:var(--mintg-bg);border-radius:14px;padding:14px 16px;margin-bottom:14px}.cover b{color:var(--mintg-ink);font-size:14px}
  .firsthint{display:flex;gap:10px;background:var(--coral-bg);border-radius:14px;padding:13px 16px;margin-bottom:18px}.firsthint .sm{color:var(--coral-ink)}
  .shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
  .shelfcard{border-radius:14px;padding:13px 15px}.shelfcard .hd{font-family:'IBM Plex Sans';font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}.shelfcard .it{font-size:13px;line-height:1.7;color:var(--ink2)}
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .daycard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .dayhdr{display:flex;align-items:center;gap:9px;padding:14px 16px 10px}.dayname{font-weight:800;font-size:15px;color:var(--green-deep)}.daypill{font-family:'IBM Plex Sans';font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--lime);color:var(--green-deep)}.daysub{margin-left:auto;font-size:11px;color:var(--muted);font-family:'IBM Plex Sans'}
  .meal{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}.meal:not(:last-child){border-top:1px solid var(--line)}.meal:hover{background:var(--bg)}.slot{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}.slotlabel{font-family:'IBM Plex Sans';font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.mealname{font-size:14px;font-weight:600;color:var(--ink)}.mealmeta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;align-items:center}.dur{font-family:'IBM Plex Sans';font-size:11px;color:var(--slate);font-weight:600}.mtag{font-family:'IBM Plex Sans';font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--coral-bg);color:var(--coral-ink)}.mtag.lime{background:var(--lime);color:var(--green-deep)}.chev{margin-left:auto;color:#C2CBBE;font-size:18px}
  /* recipe */
  .step{display:flex;gap:12px;font-size:14px;line-height:1.5;margin-bottom:13px;color:var(--ink2)}.step .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--mintg-bg);color:var(--green);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans'}
  .pill2{font-family:'IBM Plex Sans';display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;background:#fff;box-shadow:var(--shadow);color:var(--slate)}
  .thumbs{display:flex;gap:10px;margin:8px 0 4px}.tb{font-family:'IBM Plex Sans';height:42px;padding:0 18px;border-radius:22px;background:#fff;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--slate)}.tb.on{border-color:var(--green);background:var(--mintg-bg);color:var(--green)}
  /* fridge */
  .glabel{font-size:14px;font-weight:800;color:var(--ink2);margin:18px 0 11px;display:flex;align-items:center;gap:8px}.glabel .d{width:9px;height:9px;border-radius:50%}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .fitem{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:13px 15px}.fitem .e{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}.fitem .meta{flex:1;min-width:0}.fbar{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.fbar i{display:block;height:100%;border-radius:4px}.fstate{font-family:'IBM Plex Sans';font-size:11px;font-weight:700;padding:4px 10px;border-radius:14px;white-space:nowrap}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(12,42,20,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.on{display:flex}
  .dialog{background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:24px}
  .dialog.celebrate{background:var(--dark);color:#fff;text-align:center;max-width:420px}
  .note{background:var(--cream-bg);color:var(--cream-ink);border-radius:13px;padding:12px 15px;font-size:13px;margin:12px 0;font-family:'IBM Plex Sans'}
  .check{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer;font-size:14px}.cobox{width:24px;height:24px;border-radius:7px;border:1.7px solid #CBD4C5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}.check.on .cobox{background:var(--green);border-color:var(--green)}
  .tabsui{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:8px 0 12px}.tabui{font-family:'IBM Plex Sans';font-size:14px;font-weight:700;padding-bottom:10px;color:var(--muted);cursor:pointer}.tabui.on{color:var(--green-deep);border-bottom:2px solid var(--green)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--green-deep);color:#fff;border-radius:14px;padding:13px 20px;font-size:14px;font-family:'IBM Plex Sans';opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow-lg)}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;padding:70px 20px;color:var(--slate)}.empty .e{font-size:54px}
  @media(max-width:760px){
    .bar{gap:10px;padding:0 14px}.search{display:none}.nlink{padding:8px 10px}
    .wrap{padding:18px 14px 80px}.hero{grid-template-columns:1fr}.cartlayout{grid-template-columns:1fr}
    h1{font-size:23px}
  }
</style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="logo" data-go="shop">GoLemon 💚</div>
      <div class="search" data-go="shop">🔍 Search 7,000+ products</div>
      <nav>
        <span class="nlink" data-go="shop">Shop</span>
        <span class="nlink" data-go="fridge">Fridge</span>
        <span class="nlink" data-go="plan">Meal plan</span>
        <button class="cartbtn" data-go="cart">🧺 Basket <span class="badge" id="cartBadge">0</span></button>
      </nav>
    </div>
  </header>
  <main id="app"></main>
  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="dialog" id="modalBody"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
